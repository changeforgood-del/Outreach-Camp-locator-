<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fresno Outreach Interactive Map — Jan–Jun 2026</title>
<style>html,body{margin:0;height:100%;font-family:Arial,sans-serif}#loading{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center}</style>
</head>
<body>
<div id="loading">Loading Fresno Outreach Interactive Map — Jan–Jun 2026…</div>
<script>
(async()=>{
  try {
    const files=['chunks/part1.txt','chunks/part2.txt','chunks/part3.txt','chunks/part4.txt'];
    const parts=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error('Missing map data: '+f);return r.text();}));
    const b64=parts.join('').replace(/\s/g,'');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('This browser does not support DecompressionStream.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  } catch(e) {
    document.getElementById('loading').innerHTML='<div><h2>Map could not load</h2><p>'+e.message+'</p><p>Try Chrome, Edge, Firefox, or Safari.</p></div>';
  }
})();
</script>
</body>
</html>
